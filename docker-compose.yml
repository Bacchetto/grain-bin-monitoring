# Local development infrastructure.
#
#   docker compose up -d           start PostgreSQL, Prometheus and Grafana
#   docker compose up -d db        just the database
#   docker compose ps              db should show "healthy"
#   docker compose down            stop them; data survives in the volumes
#   docker compose down -v         stop them and delete all data
#   docker compose up -d --build   after editing anything under ops/: the
#                                  Prometheus and Grafana config is built into
#                                  their images (see ops/*/Dockerfile for why)
#
#   Grafana:    http://localhost:3000   (the Grain Bin Telemetry dashboard)
#   Prometheus: http://localhost:9090   (Status > Targets shows whether the
#                                        API is being scraped)
#
# The API itself runs one of two ways -- never both, as both use port 8080:
#   cd backend && ./mvnw spring-boot:run      on the host, for development
#   docker compose --profile api up -d        as the production image
# Prometheus scrapes whichever is running, as host.docker.internal:8080.
#
# Values come from .env in this directory, which Compose reads automatically,
# falling back to the defaults below. Those defaults match the ones in
# backend/src/main/resources/application.properties, so the API connects with no
# .env at all -- and when there is one, both sides read the same file.

name: grain-bin-monitoring

services:
  db:
    # Pinned to the same major version as production (RDS PostgreSQL 16) and as
    # the Testcontainers image, so local, test and cloud all run one version.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grain
      POSTGRES_USER: ${DB_USER:-grain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grain}
    ports:
      # Published on localhost only. Binding to all interfaces would expose a
      # database with a development password to the whole network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ passes a literal $ through to the container, so these are the
      # container's own variables rather than ones Compose substitutes.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # The production image from backend/Dockerfile. Behind a profile, so a
    # plain `docker compose up` still leaves port 8080 free for the host-run
    # API; `--profile api` adds it.
    profiles: ["api"]
    build: ./backend
    depends_on:
      db:
        # Wait for PostgreSQL to accept connections, not merely to start:
        # Flyway runs as the API starts and needs the database immediately.
        condition: service_healthy
    environment:
      # Inside the Compose network the database is the `db` service, not
      # localhost.
      DB_URL: jdbc:postgresql://db:5432/grain
      DB_USER: ${DB_USER:-grain}
      DB_PASSWORD: ${DB_PASSWORD:-grain}
      # No fallback: the API refuses to start without a token, which is the
      # point (ADR 0003). It comes from .env.
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      # The same port the host-run API uses, so the dashboard, the simulator
      # and Prometheus find it without any change.
      - "127.0.0.1:8080:8080"

  prometheus:
    # Prometheus with ops/prometheus/prometheus.yml built in; the base image
    # version is pinned in that Dockerfile.
    build: ./ops/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Local metrics are for watching a run, not for history; a week is plenty
      # and keeps the volume small.
      - --storage.tsdb.retention.time=7d
    volumes:
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Prometheus reaches the API on the host as host.docker.internal, a name
    # that Rancher Desktop and Docker Desktop both define. Do NOT add
    # `extra_hosts: host.docker.internal:host-gateway` here, as guides for
    # Linux suggest: under Rancher Desktop it replaces the working name with
    # the address of the engine's own VM, where nothing is listening -- tried,
    # and the scrape failed with "connection refused". Only Docker running
    # natively on Linux needs that line.

  grafana:
    # Grafana with the data source and dashboard from ops/grafana built in.
    build: ./ops/grafana
    depends_on:
      - prometheus
    environment:
      # The admin account can edit; anyone else gets a read-only view. Local
      # only: the port is bound to localhost, and neither setting is how a
      # deployed Grafana would be run. The password comes from .env; the
      # fallback is for a fresh checkout with no .env at all.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Open straight onto the provisioned dashboard.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/grain-telemetry.json
      # No phoning home from a development machine.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  # Named, so data outlives the container: `down` keeps it, `down -v` removes it.
  pgdata:
  promdata:
  grafanadata:
