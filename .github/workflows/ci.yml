# Continuous integration: every check the README requires before a milestone
# is done, on every pull request and every push to main.
#
# The jobs run in parallel, each on a fresh Ubuntu machine. deploy.yml
# (Milestone 3 Phase 5) waits for this workflow to pass on main before it
# deploys anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow's token can read the repository and nothing
# else. No job here needs to write to GitHub or reach AWS.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes, so only
# the latest commit is checked. Runs on main are never cancelled: every commit
# there may be deployed, so each one is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to a major version: fixes and security patches arrive
# automatically, breaking changes do not. Stricter still is pinning to a full
# commit SHA (uses: actions/checkout@<40-char sha> # v7.0.1), which cannot be
# re-pointed by the action's publisher -- worth doing once Dependabot is set up
# to keep the SHAs current.

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      # The whole history, not just the latest commit: a secret added in one
      # commit and deleted in the next is still in the repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The official release binary, checked against the release's published
      # checksums before it runs -- rather than a third-party action that would
      # run with this workflow's token.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Fails the job on any finding. --redact keeps the secret itself out of
      # the public log.
      - run: gitleaks git --redact --no-banner --verbose .

  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2, keyed on the pom, so dependencies download once
          # rather than on every run.
          cache: maven

      # Unit and integration tests. Testcontainers starts real PostgreSQL in
      # Docker, which GitHub's Ubuntu runners provide. The admin token the
      # tests need is set in the surefire configuration, so no secret is
      # involved.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Caches npm's download cache, keyed on package-lock.json.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: installs exactly what package-lock.json
      # says, and fails if package.json and the lock file disagree.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  simulator:
    name: Simulator (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulator/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      # The end-to-end tests need a live stack and skip themselves without
      # SIM_E2E_URL; everything else runs.
      - run: pytest

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # BuildKit, which the Dockerfile's `RUN --mount=type=cache` needs.
      - uses: docker/setup-buildx-action@v4

      # Builds the production image to prove it builds; nothing is pushed.
      # type=gha stores the image's layers in GitHub's cache between runs, so
      # an unchanged dependency layer is not rebuilt.
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: grain-telemetry-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.2'

      # Formatting is checked across all of infra/ at once. A difference fails
      # the job; `terraform fmt -recursive infra` fixes it locally.
      - run: terraform fmt -check -recursive infra

      # validate checks each configuration is internally consistent: types,
      # references, required arguments. It needs the providers but NOT AWS
      # credentials, and -backend=false skips connecting to the state bucket,
      # so this job never touches AWS. (terraform plan, which does, runs in
      # plan.yml.)
      - name: Validate each configuration
        run: |
          for dir in infra/bootstrap infra/terraform; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
