spring.application.name=telemetry

# --- Database --------------------------------------------------------------
# Every value comes from the environment so that the same container image runs
# locally and in AWS, where these are injected from Secrets Manager. The
# defaults after ':' match docker-compose.yml, so a fresh checkout starts
# without a .env file. There is deliberately no default for a production host.
#
# Do NOT add reWriteBatchedInserts=true to this URL, tempting as it is for
# throughput. It makes the driver report SUCCESS_NO_INFO instead of per-row
# update counts, and those counts are how ingest tells accepted readings from
# duplicates. IngestService fails loudly if it sees one, so the symptom would be
# every ingest request returning 500. See IngestService.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grain}
spring.datasource.username=${DB_USER:grain}
spring.datasource.password=${DB_PASSWORD:grain}

# --- Migrations ------------------------------------------------------------
# Flyway runs at startup, before the application serves traffic. Migrations are
# append-only: validate-on-migrate makes the app refuse to start if an already
# applied migration file has been edited, which is exactly the mistake the
# working agreement forbids.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# --- Actuator --------------------------------------------------------------
# Expose only the two endpoints the README calls for. Everything else stays off
# so the service does not leak environment or bean details over HTTP.
#   health     -> ALB target-group checks and the container HEALTHCHECK
#   prometheus -> scraped by Prometheus locally and CloudWatch in AWS
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Spring Boot 4 disables every metrics exporter by default, so exposing the
# endpoint above is not sufficient on its own -- without this,
# /actuator/prometheus answers 404 and the only symptom is a Prometheus target
# that silently never scrapes. This was Boot 3 behaviour by default and is a
# genuine change.
management.prometheus.metrics.export.enabled=true

# --- Readings partitions ---------------------------------------------------
# The readings table is partitioned by month and has no default partition, so
# the partition covering a row must exist before the row is written. A
# scheduled job keeps the next few months available; the ingest path also
# creates on demand, which covers devices with skewed clocks or long
# back-fills. Daily at 02:15 UTC is arbitrary -- the work is trivial and the
# on-demand path is the real guarantee.
app.partitions.maintenance-cron=0 15 2 * * *

# --- API authentication ----------------------------------------------------
# Bearer token for the admin and dashboard endpoints. Required: there is no
# default and the application refuses to start without it, because starting
# with a blank token would serve every admin endpoint to anyone who asks and
# would do so silently. The ingest endpoint is authenticated separately, per
# device, by the X-Device-Key header.
app.security.admin-token=${ADMIN_TOKEN:}
