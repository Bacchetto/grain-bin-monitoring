# Local development profile. Active only under `./mvnw spring-boot:run` -- the
# Maven plugin switches it on (see pom.xml). Tests and the packaged jar never
# see it.
#
# It does one thing: read the repository's root .env, so the API and Docker
# Compose are configured from the same file. Spring Boot does not read .env
# files by itself, which otherwise means a password changed in .env reaches the
# database but not the application that connects to it.
#
# .env's KEY=VALUE lines are valid .properties, which is what the
# [.properties] hint says. The keys are the environment variable names --
# DB_URL, ADMIN_TOKEN -- and application.properties already reads them through
# ${...} placeholders, so nothing else needs to change. A variable exported in
# the shell still takes precedence over the file.
#
# `optional:` because a .env is not required: without one, the defaults in
# application.properties match docker-compose.yml. The path is relative to
# backend/, which is where spring-boot:run runs.
spring.config.import=optional:file:../.env[.properties]

# Readable log lines at a terminal. An empty value turns structured logging
# off and Spring Boot falls back to its usual text pattern. Production and the
# tests keep the JSON format from application.properties.
logging.structured.format.console=
