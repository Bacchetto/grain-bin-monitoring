# Test configuration only. The simulator is a script, not a distributed
# package, so there is no build system here.

[tool.pytest.ini_options]
# The modules live beside sim.py rather than in a package, so the tests need
# this directory on the import path -- the same one Python adds when sim.py is
# run as a script.
pythonpath = ["."]
testpaths = ["tests"]
# The end-to-end tests need a running stack and are skipped without one;
# `pytest -m e2e` runs only them. See tests/test_e2e.py.
markers = [
    "e2e: needs a live API at SIM_E2E_URL (skipped otherwise)",
]
# Unknown markers are errors, so a typo cannot silently select nothing.
addopts = ["--strict-markers"]
