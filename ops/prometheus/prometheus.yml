# Prometheus: what to scrape, and how often.
#
# Prometheus PULLS metrics: every scrape_interval it requests each target's
# metrics page and stores every number with a timestamp. The API publishes
# that page at /actuator/prometheus (Spring Boot Actuator + Micrometer).

global:
  # How often to scrape. 15 s is the usual default: fine enough to see a
  # simulator run ramp up, coarse enough to store little. Grafana's rate()
  # needs at least two scrapes in its window, so panels use $__rate_interval,
  # which Grafana sizes from this.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: grain-telemetry-api
    metrics_path: /actuator/prometheus
    static_configs:
      # The API runs on the host, not in Compose, until the Milestone 3
      # Dockerfile. host.docker.internal is how a container reaches the host:
      # Rancher Desktop and Docker Desktop both define it (see the note in
      # docker-compose.yml about why it is not overridden there).
      - targets: ["host.docker.internal:8080"]
        labels:
          environment: local
